services:
  # 1. THE DATABASE (PostgreSQL)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drizzle-postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Built-in Postgres readiness check
      test: ["CMD-SHELL", "pg_isready -U drizzle-postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. THE CACHE (Redis)
  cache:
    image: redis:8.0-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      # Uses the built-in redis-cli tool to ping the server
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. THE BACKEND (TypeScript API)
