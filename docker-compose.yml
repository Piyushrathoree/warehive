  #     context: ./backend
  #     dockerfile: Dockerfile
  #   environment:
  #     - DATABASE_URL=postgres://drizzle-postgres:mypassword@db:5432/postgres
  #     - REDIS_URL=redis://cache:6339
  #   ports:
  #     - "5000:5000"
  #   healthcheck:
  #     # Pings your TypeScript app's health endpoint
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 5s
  #   depends_on:
  #     db:
  #       condition: service_healthy    # Waits for Postgres to be ready
